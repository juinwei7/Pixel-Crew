name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixel-crew-portable
          path: release/pixel-crew

  macos-package:
    name: Package macOS (${{ matrix.arch }})
    needs: test
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            node_checksum: ef28d8fab2c0e4314522d4bb1b7173270aa3937e93b92cb7de79c112ac1fa953
          - arch: x64
            runner: macos-15-intel
            node_checksum: b8da981b8a0b1241b70249204916da76c63573ddf5814dbd2d1e41069105cb81
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package

      - name: Download verified Node runtime
        shell: bash
        env:
          NODE_VERSION: 22.23.1
          NODE_ARCH: ${{ matrix.arch }}
          NODE_CHECKSUM: ${{ matrix.node_checksum }}
        run: |
          archive="node-v${NODE_VERSION}-darwin-${NODE_ARCH}.tar.gz"
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/${archive}"
          printf '%s  %s\n' "$NODE_CHECKSUM" "$archive" | shasum -a 256 -c -
          tar -xzf "$archive"
          printf 'NODE_RUNTIME=%s/%s\n' "$PWD" "${archive%.tar.gz}" >> "$GITHUB_ENV"

      - name: Build certificate-free app bundle
        run: npm run package:macos -- --arch "${{ matrix.arch }}" --runtime "$NODE_RUNTIME"

      - name: Archive app bundle
        shell: bash
        run: |
          mkdir -p release/assets
          tar -czf "release/assets/pixel-crew-macos-${{ matrix.arch }}.tar.gz" \
            -C "release/macos/${{ matrix.arch }}" "Pixel Crew.app"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixel-crew-macos-${{ matrix.arch }}
          path: release/assets/pixel-crew-macos-${{ matrix.arch }}.tar.gz

  windows-package:
    name: Package Windows (x64)
    needs: test
    if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package

      - name: Download verified Node runtime
        shell: pwsh
        env:
          NODE_VERSION: 22.23.1
          NODE_CHECKSUM: 7df0bc9375723f4a86b3aa1b7cc73342423d9677a8df4538aca31a049e309c29
        run: |
          $Archive = "node-v$env:NODE_VERSION-win-x64.zip"
          Invoke-WebRequest "https://nodejs.org/dist/v$env:NODE_VERSION/$Archive" -OutFile $Archive
          $Actual = (Get-FileHash -Algorithm SHA256 $Archive).Hash.ToLowerInvariant()
          if ($Actual -ne $env:NODE_CHECKSUM) { throw "Node runtime checksum mismatch" }
          Expand-Archive -LiteralPath $Archive -DestinationPath .
          "NODE_RUNTIME=$pwd\$($Archive.Replace('.zip', ''))" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build self-contained Windows bundle
        run: npm run package:windows -- --runtime "$env:NODE_RUNTIME"

      - name: Stage single-file Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/assets | Out-Null
          Copy-Item -LiteralPath "release/windows/x64/Pixel Crew.exe" `
            -Destination "release/assets/Pixel Crew.exe"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixel-crew-windows-x64
          path: release/assets/Pixel Crew.exe

  publish:
    name: Publish release
    needs: [package, macos-package, windows-package]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Validate semantic version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+\.)*[0-9A-Za-z-]+)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a semantic version (for example, v1.0.0)."
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download portable package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pixel-crew-portable
          path: release/pixel-crew

      - name: Download macOS packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: pixel-crew-macos-*
          path: release/assets
          merge-multiple: true

      - name: Download Windows package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pixel-crew-windows-x64
          path: release/assets

      - name: Create release checksums
        shell: bash
        run: |
          mkdir -p release/assets
          cp release/pixel-crew/install-pixel-crew-macos.sh release/assets/
          cd release/assets
          sha256sum *.tar.gz *.sh *.exe > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            release/assets/pixel-crew-macos-arm64.tar.gz
            release/assets/pixel-crew-macos-x64.tar.gz
            release/assets/Pixel Crew.exe
            release/assets/install-pixel-crew-macos.sh
            release/assets/SHA256SUMS.txt

      - name: Publish package to npm
        working-directory: release/pixel-crew
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; skipping npm publish."
            exit 0
          fi
          npm publish --access public
