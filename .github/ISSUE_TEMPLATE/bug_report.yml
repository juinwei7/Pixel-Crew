name: "🐛 Bug report / 問題回報"
description: "Something is broken / 有東西壞了"
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened? / 發生了什麼？"
      description: "Describe the bug, and what you expected instead. / 描述問題與你預期的行為。"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce / 重現步驟"
      placeholder: |
        1. Create a Codex NPC in room X
        2. Send command "..."
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Pixel Crew version / 版本"
      description: "Top-right health popover shows it (e.g. v1.0.0). / 右上健康狀態彈窗可看到。"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: "OS"
      options:
        - macOS
        - Windows 10/11
        - Linux
    validations:
      required: true
  - type: input
    id: cli
    attributes:
      label: "Provider CLI versions / CLI 版本"
      placeholder: "claude --version / codex --version"
  - type: textarea
    id: logs
    attributes:
      label: "Logs / console errors（若有）"
      description: "Server terminal output or browser DevTools console. / 伺服器終端輸出或瀏覽器 console。"
      render: text
